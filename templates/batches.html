{% extends "base.html" %}
{% block content %}
<div class="container">
  <h2>Batches for Project {{ project_id }}</h2>

  <div class="card">
    <h3>Create New Batch</h3>
    <form method="post" action="{{ url_for('projects.manage_batches', project_id=project_id) }}">
      <input type="text" name="batch_name" placeholder="Batch name" required>
      <button type="submit" class="btn">Create Batch</button>
    </form>
  </div>

  <div class="card">
    <h3>Existing Batches</h3>
    {% if batches %}
      <ul>
        {% for b in batches %}
          <li>
            {{ b['name'] }} - <a href="{{ url_for('projects.view_batch', batch_id=b['id']) }}">View</a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No batches yet.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
