{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>{{ project['name'] }}</h2>
    <p>{{ project['description'] or "No description provided." }}</p>
    <p><strong>Created:</strong> {{ project['created_at'] }}</p>

    <form action="{{ url_for('projects.delete_project', project_id=project['id']) }}" method="post">
        <button type="submit" class="btn btn-danger">Delete Project</button>
    </form>

    <a href="{{ url_for('projects.list_projects') }}" class="btn">Back to Projects</a>
</div>
{% endblock %}
