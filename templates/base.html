<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UStoria - Your User Story Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1>UStoria</h1>
            <p>User Story Assistant</p>
            <nav>
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('projects.list_projects') }}">Projects</a>
                <a href="{{ url_for('evaluation.evaluate') }}">Evaluation</a>
                <a href="{{ url_for('evaluation.evaluate_by_criterion') }}">Evaluation by Criterion</a>
                <a href="{{ url_for('evaluation.performance') }}">Performance Analysis</a>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('about') }}">About</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}
        <!-- Page-specific content will be injected here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; {{ current_year }} UStoria · All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
