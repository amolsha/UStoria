<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UStoria - Your User Story Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1>UStoria</h1>
            <p>User Story Assistant</p>
<nav class="navbar navbar-expand-lg navbar-light bg-light rounded px-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">UStoria</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('projects.list_projects') }}">Projects</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('evaluation.evaluate') }}">Evaluation</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('evaluation.evaluate_by_criterion') }}">Evaluation by Criterion</a>
        </li>

        <!-- ✅ Dropdown for Performance Analysis -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="performanceDropdown" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            Performance Analysis
          </a>
          <ul class="dropdown-menu" aria-labelledby="performanceDropdown">
            <li>
              <a class="dropdown-item" href="{{ url_for('evaluation.performance_run') }}">
                By Runs
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="{{ url_for('evaluation.performance_llm') }}">
                By LLMs
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="{{ url_for('evaluation.performance_llm_charts') }}">
                Generate Charts
              </a>
            </li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}
        <!-- Page-specific content will be injected here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; {{ current_year }} UStoria · All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
