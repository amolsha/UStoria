{% extends "base.html" %}
{% block content %}
<div class="container">
  <h2>Edit Project</h2>
  <div class="card">
    <form method="post" action="{{ url_for('projects.edit_project', project_id=project['id']) }}">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{ project['name'] }}" required>
      
      <label for="description">Description</label>
      <textarea name="description" id="description">{{ project['description'] }}</textarea>
      
      <button type="submit" class="btn">Save Changes</button>
      <a href="{{ url_for('projects.list_projects') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
