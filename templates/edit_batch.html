{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Edit Batch</h2>
    <form method="post" action="{{ url_for('projects.edit_batch', batch_id=batch['id']) }}">
        <label for="name">Batch Name</label>
        <input type="text" name="name" id="name" value="{{ batch['name'] }}" required>

        <label for="description">Description</label>
        <textarea name="description" id="description">{{ batch['description'] }}</textarea>

        <button type="submit" class="btn btn-primary mt-2">Update Batch</button>
        <a href="{{ url_for('projects.view_batch', batch_id=batch['id']) }}" class="btn btn-secondary mt-2">Cancel</a>
    </form>

    <form method="post" action="{{ url_for('projects.delete_batch', batch_id=batch['id']) }}" class="mt-3">
        <button type="submit" class="btn btn-danger">Delete Batch</button>
    </form>
</div>
{% endblock %}
