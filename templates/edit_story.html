{% extends "base.html" %}
{% block content %}
<div class="container">
  <h2>Edit Story</h2>
  <form method="post">
    <label for="text">User Story</label>
    <textarea name="text" id="text" required>{{ story['text'] }}</textarea>
    <button type="submit" class="btn">Update</button>
    <a href="{{ url_for('projects.view_project', project_id=project_id) }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
